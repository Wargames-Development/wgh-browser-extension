name: Feature request
description: Suggest an improvement or future workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please keep requests aligned with the project security model: no credential collection, no cookie/session-token collection, no login/2FA bypass, and no hidden form submission.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Why is this useful?
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Related workflow
      options:
        - Technic changelog posting
        - Future update publisher
        - Browser compatibility
        - Documentation
        - Other
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Does this require any new browser permission or third-party page access?
